# haproxy-fts.cfg — FreeTAKServer vhost ACLs and backend stanzas
# Additive patch for /etc/haproxy/haproxy.cfg on the dapla.net stack.
#
# Do NOT commit your live haproxy.cfg to this repo — it contains secrets.
#
# Services exposed under *.tak.dapla.net:
#
#   tak.dapla.net        :19023  REST API  (HTTP/HTTPS)
#   cot.tak.dapla.net    :8087   CoT TCP streaming  (TCP passthrough)
#   cots.tak.dapla.net   :8089   CoT SSL streaming  (TCP passthrough)
#   data.tak.dapla.net   :8080   Data packages / HTTP API (HTTP/HTTPS)
#   fed.tak.dapla.net    :9000   Federation (TCP passthrough)
#   ui.tak.dapla.net     :5000   Web UI (HTTP/HTTPS)
#
# Integration assumptions (match dapla.net stack):
#   - Wildcard cert:  /etc/haproxy/certs/dapla_stack.pem
#   - CF origin pull: /etc/haproxy/certs/cloudflare-origin-pull.pem
#   - HTTP frontend:  named 'http', bound on 192.168.88.106:80 and :443
#   - ftsvc container publishes on localhost, rootless pasta networking
#   - check inter 10s matches all existing backends in the stack
#
# Merge instructions:
#   1. Add the ACL + use_backend lines to your existing 'frontend http' block
#   2. Append the backend blocks below the existing backends
#   3. Add the TCP frontend blocks (cot/cots/fed) outside the http frontend
#   4. Validate: haproxy -c -f /etc/haproxy/haproxy.cfg
#   5. Reload:   systemctl reload haproxy

# ════════════════════════════════════════════════════════════════════════════
# frontend http — additive lines only (merge into existing block)
# ════════════════════════════════════════════════════════════════════════════
#
# Paste these ACL lines alongside your existing vhost_* ACLs:
#
#        ## [ FTS vhosts
#        acl             vhost_fts_api  hdr(host) -i tak.dapla.net
#        acl             vhost_fts_data hdr(host) -i data.tak.dapla.net
#        acl             vhost_fts_ui   hdr(host) -i ui.tak.dapla.net
#
# Paste these use_backend lines alongside your existing use_backend directives:
#
#        use_backend     fts_api  if vhost_fts_api
#        use_backend     fts_data if vhost_fts_data
#        use_backend     fts_ui   if vhost_fts_ui
#
# ════════════════════════════════════════════════════════════════════════════

# ── HTTP/HTTPS backends ───────────────────────────────────────────────────────

# REST API — tak.dapla.net
# FTS SystemStatus, mission packages, API key auth
backend fts_api
        balance         roundrobin
        option          httpchk GET /SystemStatus/getStatus
        http-check      expect status 200
        server          node1 127.0.0.1:19023 check inter 10s

# Data packages — data.tak.dapla.net
# TAK client data package downloads; also carries HTTP CoT relay
backend fts_data
        balance         roundrobin
        server          node1 127.0.0.1:8080 check inter 10s

# Web UI — ui.tak.dapla.net
# FreeTAKServer browser management interface
backend fts_ui
        balance         roundrobin
        server          node1 127.0.0.1:5000 check inter 10s

# ── TCP passthrough frontends + backends ──────────────────────────────────────
# CoT and federation cannot share the HTTP frontend — they are raw TCP streams.
# Add these blocks outside (after) the closing brace of frontend http.

# CoT TCP — cot.tak.dapla.net:8087
# Plain Cursor-on-Target streaming for ATAK/WinTAK clients
frontend fts_cot
        mode            tcp
        bind            192.168.88.106:8087
        option          tcplog
        timeout client  5m
        default_backend fts_cot_back

backend fts_cot_back
        mode            tcp
        timeout connect 10s
        timeout server  5m
        option          tcp-check
        server          node1 127.0.0.1:8087 check inter 10s

# CoT SSL — cots.tak.dapla.net:8089
# TLS-wrapped CoT stream; HAProxy passes through, FTS terminates TLS
# (FTS manages its own PKI for client cert auth — do not terminate here)
frontend fts_cots
        mode            tcp
        bind            192.168.88.106:8089
        option          tcplog
        timeout client  5m
        default_backend fts_cots_back

backend fts_cots_back
        mode            tcp
        timeout connect 10s
        timeout server  5m
        option          tcp-check
        server          node1 127.0.0.1:8089 check inter 10s

# Federation — fed.tak.dapla.net:9000
# Server-to-server FTS federation; raw TCP, FTS manages TLS internally
frontend fts_fed
        mode            tcp
        bind            192.168.88.106:9000
        option          tcplog
        timeout client  10m
        default_backend fts_fed_back

backend fts_fed_back
        mode            tcp
        timeout connect 10s
        timeout server  10m
        option          tcp-check
        server          node1 127.0.0.1:9000 check inter 10s
