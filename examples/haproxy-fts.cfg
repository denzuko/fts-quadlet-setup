# haproxy-fts.cfg — FreeTAKServer vhost ACLs and backend stanzas
# Additive patch for /etc/haproxy/haproxy.cfg on the dapla.net stack.
#
# Do NOT commit your live haproxy.cfg to this repo — it contains secrets.
#
# TLS model: HAProxy terminates ALL TLS. Containers receive plain traffic.
#   - Wildcard cert: /etc/haproxy/certs/dapla_stack.pem
#   - CF origin pull: /etc/haproxy/certs/cloudflare-origin-pull.pem
#
# Services exposed under *.tak.dapla.net:
#
#   tak.dapla.net        :443    REST API       HAProxy TLS → plain :19023
#   cot.tak.dapla.net    :8087   CoT TCP        plain TCP passthrough
#   cots.tak.dapla.net   :8089   CoT SSL/TLS    HAProxy TLS → plain :8089
#   data.tak.dapla.net   :443    Data packages  HAProxy TLS → plain :8080
#   fed.tak.dapla.net    :9000   Federation     HAProxy TLS → plain :9000
#   ui.tak.dapla.net     :443    Web UI         HAProxy TLS → plain :5000
#
# Integration assumptions (match dapla.net stack):
#   - HTTP/HTTPS frontend: named 'http', bound on 192.168.88.106:80 and :443
#     with ssl crt /etc/haproxy/certs/dapla_stack.pem already configured
#   - ftsvc containers publish on localhost via rootless pasta networking
#   - check inter 10s matches all existing backends in the stack
#
# Merge instructions:
#   1. Add ACL + use_backend lines to your existing 'frontend http' block
#   2. Append the HTTP backend blocks below existing backends
#   3. Add the CoT TCP and TLS frontend blocks outside frontend http
#   4. Validate: haproxy -c -f /etc/haproxy/haproxy.cfg
#   5. Reload:   systemctl reload haproxy

# ════════════════════════════════════════════════════════════════════════════
# frontend http — additive lines only (merge into existing block)
# ════════════════════════════════════════════════════════════════════════════
#
#        ## [ FTS vhosts — HAProxy terminates TLS, plain to container
#        acl             vhost_fts_api  hdr(host) -i tak.dapla.net
#        acl             vhost_fts_data hdr(host) -i data.tak.dapla.net
#        acl             vhost_fts_ui   hdr(host) -i ui.tak.dapla.net
#
#        use_backend     fts_api  if vhost_fts_api
#        use_backend     fts_data if vhost_fts_data
#        use_backend     fts_ui   if vhost_fts_ui
#
# ════════════════════════════════════════════════════════════════════════════

# ── HTTP backends (HAProxy terminates TLS; containers receive plain) ──────────

# REST API — tak.dapla.net
backend fts_api
        balance         roundrobin
        option          httpchk GET /SystemStatus/getStatus
        http-check      expect status 200
        server          node1 127.0.0.1:19023 check inter 10s

# Data packages — data.tak.dapla.net
backend fts_data
        balance         roundrobin
        server          node1 127.0.0.1:8080 check inter 10s

# Web UI — ui.tak.dapla.net
backend fts_ui
        balance         roundrobin
        server          node1 127.0.0.1:5000 check inter 10s

# ── CoT TCP — plain passthrough (no TLS on CoT stream) ───────────────────────
# cot.tak.dapla.net:8087 — ATAK/WinTAK plain CoT stream; no TLS in protocol

frontend fts_cot
        mode            tcp
        bind            192.168.88.106:8087
        option          tcplog
        timeout client  5m
        default_backend fts_cot_back

backend fts_cot_back
        mode            tcp
        timeout connect 10s
        timeout server  5m
        option          tcp-check
        server          node1 127.0.0.1:8087 check inter 10s

# ── CoT SSL — HAProxy terminates TLS, plain to container ─────────────────────
# cots.tak.dapla.net:8089
# HAProxy presents dapla_stack.pem; container receives plain CoT on :8089
# FTS_CLIENT_CERT_REQUIRED must be False (client cert auth handled externally)

frontend fts_cots
        mode            tcp
        bind            192.168.88.106:8089 ssl crt /etc/haproxy/certs/dapla_stack.pem
        option          tcplog
        timeout client  5m
        default_backend fts_cots_back

backend fts_cots_back
        mode            tcp
        timeout connect 10s
        timeout server  5m
        option          tcp-check
        server          node1 127.0.0.1:8089 check inter 10s

# ── Federation — HAProxy terminates TLS, plain to container ──────────────────
# fed.tak.dapla.net:9000
# HAProxy presents dapla_stack.pem; container receives plain federation on :9000

frontend fts_fed
        mode            tcp
        bind            192.168.88.106:9000 ssl crt /etc/haproxy/certs/dapla_stack.pem
        option          tcplog
        timeout client  10m
        default_backend fts_fed_back

backend fts_fed_back
        mode            tcp
        timeout connect 10s
        timeout server  10m
        option          tcp-check
        server          node1 127.0.0.1:9000 check inter 10s
